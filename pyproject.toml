[project]
name = "graph-agent-orchestrator"
version = "0.1.0"
description = "Intent-driven multi-agent orchestrator using LangGraph, MCP, and Graphify"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "pydantic>=2.0",
    "graphifyy[mcp]>=0.8",
    "mcp>=1.0",
    "networkx>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic"]
google = ["langchain-google-genai"]
ollama = ["langchain-ollama"]
all-llm = [
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-ollama",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "skills"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["harness", "skills", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "N", "UP", "B", "SIM"]
ignore = ["B904"]  # Allow raise-without-from in ImportError re-raise patterns

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
